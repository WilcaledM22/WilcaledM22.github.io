<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Chase Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
        #score {
            position: absolute; top: 10px; left: 10px; color: white;
            font-family: Arial, sans-serif; font-size: 20px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    // Set canvas size
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Game state
    let player = { x: canvas.width / 2, y: canvas.height / 2, size: 20 };
    let enemies = [];
    let score = 0;
    let gameOver = false;
    let frames = 0;

    // Move player with mouse
    window.addEventListener("mousemove", (e) => {
        if (!gameOver) {
            player.x = e.clientX;
            player.y = e.clientY;
        }
    });

    // Create enemy
    function spawnEnemy() {
        const size = 20 + Math.random() * 10;
        let x, y;
        // Spawn on edges
        if (Math.random() < 0.5) {
            x = Math.random() < 0.5 ? 0 - size : canvas.width + size;
            y = Math.random() * canvas.height;
        } else {
            x = Math.random() * canvas.width;
            y = Math.random() < 0.5 ? 0 - size : canvas.height + size;
        }
        enemies.push({ x, y, size, speed: 1.5 + Math.random() * 2 });
    }

    // Game Loop
    function update() {
        if (gameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Spawn enemies periodically
        frames++;
        if (frames % 30 === 0) spawnEnemy();

        // Draw Player
        ctx.fillStyle = "#3498db";
        ctx.fillRect(player.x - player.size / 2, player.y - player.size / 2, player.size, player.size);

        // Update & Draw Enemies
        enemies.forEach((enemy, index) => {
            // Chase logic
            let dx = player.x - enemy.x;
            let dy = player.y - enemy.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            
            enemy.x += (dx / dist) * enemy.speed;
            enemy.y += (dy / dist) * enemy.speed;

            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(enemy.x - enemy.size / 2, enemy.y - enemy.size / 2, enemy.size, enemy.size);

            // Collision detection
            if (dist < (player.size / 2 + enemy.size / 2)) {
                gameOver = true;
                alert("Game Over! Score: " + Math.floor(score));
                document.location.reload();
            }
        });

        score += 0.1;
        scoreElement.innerText = "Score: " + Math.floor(score);
        requestAnimationFrame(update);
    }

    update();
</script>
</body>
</html>
