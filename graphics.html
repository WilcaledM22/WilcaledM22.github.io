<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <svg width="300" height="300" onmousedown="grow()" onmouseup="shrink()">
        <circle cx="150" cy="150" r="100" fill="skyblue" stroke="black" stroke-width="5"/>
        <circle cx="115" cy="120" r="15"/>
        <circle cx="185" cy="120" r="15"/>
        <circle id="mouth" cx="150" cy="150" r="15"/>
    </svg>
</body>
<script>
    function grow() {
        const circle = document.getElementById("mouth");
        circle.setAttribute("r", "40");
        circle.setAttribute("cy", "170");
    }
    function shrink() {
        const circle = document.getElementById("mouth");
        circle.setAttribute("r", "15");
        circle.setAttribute("cy", "220");
    }
</script>
</html>
